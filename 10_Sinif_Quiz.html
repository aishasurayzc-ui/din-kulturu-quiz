<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Din Kültürü Quiz</title>
<style>
:root{
  --bg:#040e1f;--card:#0b1a35;--card2:#0f2040;
  --blue:#1e3a8a;--blue-lt:#3b82f6;--blue-pale:#1a2f5e;
  --gold:#f59e0b;--gold-dk:#d97706;
  --green:#10b981;--green-bg:#022c22;
  --red:#ef4444;--red-bg:#2d0a0a;
  --text:#e2e8f0;--dim:#94a3b8;--border:#1e3a6e;
  --sh:0 8px 32px rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* HEADER */
.hdr{background:linear-gradient(135deg,#020a18,#0d2152);padding:18px 20px 0;text-align:center;border-bottom:1px solid var(--border)}
.hdr h1{color:#fff;font-size:1.3rem;font-weight:800}
.hdr .prep{color:var(--gold);font-size:.8rem;font-weight:600;margin-top:3px}
.hdr .sub{color:var(--dim);font-size:.75rem;margin-top:2px}
.tabs{display:flex;justify-content:center;gap:4px;margin-top:14px}
.tab{padding:9px 26px;border:none;border-radius:10px 10px 0 0;background:rgba(255,255,255,.07);color:var(--dim);font-size:.84rem;font-weight:700;cursor:pointer;transition:all .2s}
.tab.active{background:var(--gold);color:#020a18}

/* WRAP */
.wrap{max-width:660px;margin:0 auto;padding:18px 14px 50px}

/* PROGRESS */
.prog-row{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.qlabel{background:var(--blue);color:#fff;font-size:.71rem;font-weight:700;padding:4px 12px;border-radius:20px;white-space:nowrap}
.prog-track{flex:1;height:8px;background:var(--blue-pale);border-radius:4px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--blue-lt),var(--gold));border-radius:4px;transition:width .4s cubic-bezier(.4,0,.2,1);width:0%}
.spill{background:var(--gold);color:#020a18;font-size:.71rem;font-weight:800;padding:4px 12px;border-radius:20px;white-space:nowrap}

/* CARD */
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--sh);overflow:hidden;animation:cIn .3s ease}
@keyframes cIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* CAT MASCOT STRIP */
.mstrip{background:linear-gradient(135deg,#020a18,#0d2152);padding:14px 18px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--border)}
.cat-box{flex-shrink:0;width:78px;height:88px}
.cat-box svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 3px 10px rgba(0,0,0,.5))}
.cat-box.bounce{animation:catB .5s cubic-bezier(.36,.07,.19,.97)}
.cat-box.shake {animation:catS .45s cubic-bezier(.36,.07,.19,.97)}
@keyframes catB{0%,100%{transform:translateY(0) scale(1)}35%{transform:translateY(-12px) scale(1.08)}65%{transform:translateY(-4px) scale(1.03)}}
@keyframes catS{0%,100%{transform:rotate(0)}20%{transform:rotate(-6deg)}40%{transform:rotate(6deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(4deg)}}
.mmsg{color:#fff}.mmsg .hi{font-size:.9rem;font-weight:700}.mmsg .lo{font-size:.74rem;color:var(--dim);margin-top:2px}

/* PARA */
.para-lbl{background:var(--blue-pale);border-left:3px solid var(--blue-lt);padding:6px 14px;margin:14px 20px 4px;font-size:.69rem;font-weight:700;color:var(--blue-lt);text-transform:uppercase;letter-spacing:.4px;border-radius:0 5px 5px 0}
.para-box{background:#071020;border:1px solid var(--border);border-radius:8px;margin:0 20px 12px;padding:12px 15px;font-size:.85rem;line-height:1.72;color:#c8d8f0}

/* CARD BODY */
.cbody{padding:16px 20px 12px}
.qtag{display:inline-block;background:var(--blue-pale);color:var(--blue-lt);font-size:.65rem;font-weight:700;padding:2px 8px;border-radius:20px;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.ayet-box{background:#071020;border-left:3px solid var(--gold);border-radius:0 7px 7px 0;padding:9px 12px;margin-bottom:10px;font-size:.86rem;font-style:italic;line-height:1.65;color:#d4b87a}
.ayet-box .ref{font-style:normal;font-weight:700;font-size:.72rem;color:var(--gold);margin-top:4px;display:block}
.qtext{font-size:.95rem;font-weight:700;line-height:1.5;margin-bottom:12px;color:var(--text)}

/* OPTIONS */
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;align-items:flex-start;gap:9px;padding:9px 12px;border-radius:8px;border:1.5px solid var(--border);background:var(--card2);cursor:pointer;font-size:.87rem;line-height:1.44;text-align:left;transition:all .15s;width:100%;color:var(--text)}
.opt:not(.locked):hover{background:var(--blue-pale);border-color:var(--blue-lt);transform:translateX(4px)}
.okey{min-width:23px;height:23px;border-radius:50%;background:var(--blue-pale);color:var(--blue-lt);font-size:.72rem;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.opt.correct{background:var(--green-bg);border-color:var(--green);animation:pulse .3s}
.opt.correct .okey{background:var(--green);color:#fff}
.opt.wrong{background:var(--red-bg);border-color:var(--red);animation:jig .3s}
.opt.wrong .okey{background:var(--red);color:#fff}
.opt.locked{cursor:default}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.01)}}
@keyframes jig{0%,100%{transform:translateX(0)}30%{transform:translateX(-5px)}70%{transform:translateX(5px)}}

/* FEEDBACK */
.fbbar{display:none;margin:8px 20px 0;padding:7px 12px;border-radius:6px;font-size:.82rem;font-weight:700;align-items:center;gap:7px}
.fbbar.ok {display:flex;background:var(--green-bg);color:var(--green);border:1px solid var(--green)}
.fbbar.bad{display:flex;background:var(--red-bg);color:var(--red);border:1px solid var(--red)}

/* NAV */
.nav{display:flex;justify-content:space-between;align-items:center;padding:10px 20px 14px;border-top:1px solid var(--border)}
.nb{padding:9px 18px;border:none;border-radius:8px;font-size:.85rem;font-weight:700;cursor:pointer;transition:all .18s}
.nb.prev{background:var(--blue-pale);color:var(--blue-lt)}
.nb.prev:hover{background:#1e3a8a}
.nb.next{background:var(--blue);color:#fff;min-width:124px;text-align:center}
.nb.next:hover{background:var(--blue-lt);transform:translateY(-1px)}
.nb:disabled{opacity:.3;cursor:default;transform:none!important}

/* DOTS */
.dots{display:flex;gap:3px;flex-wrap:wrap;max-width:200px;justify-content:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--border);transition:all .2s}
.dot.cur{background:var(--gold);transform:scale(1.5)}
.dot.ok {background:var(--green)}
.dot.bad{background:var(--red)}
.dot.seen{background:var(--blue-pale)}

/* RESULTS */
.results{display:none;text-align:center;padding:26px 20px 32px}
.results.show{display:block;animation:cIn .4s ease}
.res-icon{font-size:4rem;margin-bottom:4px;display:block;animation:catB .7s ease .2s both}
.res-title{font-size:1.35rem;font-weight:800;color:#fff}
.res-by{font-size:.72rem;color:var(--gold);margin-top:2px;font-weight:600}
.res-sub{font-size:.82rem;color:var(--dim);margin:4px 0 18px}
.sring{width:120px;height:120px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;box-shadow:0 0 0 6px var(--blue-pale)}
.sinner{width:92px;height:92px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid var(--border)}
.sbig{font-size:1.8rem;font-weight:900;color:var(--gold);line-height:1}
.sden{font-size:.68rem;color:var(--dim)}
.stat-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:18px}
.stat{background:var(--card2);border:1px solid var(--border);border-radius:9px;padding:9px 18px;min-width:80px}
.stat .v{font-size:1.3rem;font-weight:800}
.stat .l{font-size:.66rem;color:var(--dim);margin-top:2px}
.stat.g .v{color:var(--green)}.stat.r .v{color:var(--red)}.stat.b .v{color:var(--blue-lt)}
.rbtn{background:var(--blue);color:#fff;border:none;border-radius:9px;padding:11px 24px;font-size:.86rem;font-weight:700;cursor:pointer;margin:4px;transition:all .18s}
.rbtn:hover{background:var(--blue-lt);transform:translateY(-2px)}
.rbtn.gold{background:var(--gold);color:#020a18}.rbtn.gold:hover{background:var(--gold-dk)}

/* CONFETTI */
.cfc{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999;overflow:hidden}
.cp{position:absolute;border-radius:2px;opacity:0;animation:cfF 2.8s ease-in forwards}
@keyframes cfF{0%{opacity:1;transform:translateY(-10px) rotate(0)}80%{opacity:1}100%{opacity:0;transform:translateY(100vh) rotate(760deg)}}
@media(max-width:580px){.cbody{padding:13px 13px 10px}.nav{padding:9px 13px 13px}.para-box,.para-lbl,.fbbar{margin-left:13px;margin-right:13px}}
</style>
</head>
<body>
<div class="cfc" id="cfc"></div>

<div class="hdr">
  <h1>📘 Din Kültürü ve Ahlak Bilgisi</h1>
  <div class="prep">Hazırlayan: Ayşe Yazıcı</div>
  <div class="sub">10. Sınıf · 100 Soru · Allah'ı Tanımak &amp; İslam'da Yorumlar</div>
  <div class="tabs">
    <button class="tab active" id="tab1" onclick="switchSec(1)">1. Bölüm<br><small>Allah'ı Tanımak (1–50)</small></button>
    <button class="tab" id="tab2" onclick="switchSec(2)">2. Bölüm<br><small>İslam'da Yorumlar (1–50)</small></button>
  </div>
</div>

<div class="wrap">
  <div class="prog-row">
    <span class="qlabel" id="qlabel">Soru 1 / 50</span>
    <div class="prog-track"><div class="prog-fill" id="pfill"></div></div>
    <span class="spill" id="spill">✦ 0 doğru</span>
  </div>

  <div class="card" id="card">
    <div id="plbl" class="para-lbl" style="display:none"></div>
    <div id="pbox" class="para-box" style="display:none"></div>

    <!-- CUTE CAT MASCOT -->
    <div class="mstrip">
      <div class="cat-box" id="catbox">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <!-- graduation cap -->
          <polygon points="50,4 76,16 50,28 24,16" fill="#f59e0b"/>
          <rect x="26" y="15" width="48" height="6" rx="2" fill="#d97706"/>
          <line x1="74" y1="18" x2="78" y2="30" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="78" cy="32" r="3.5" fill="#f59e0b"/>
          <!-- ears -->
          <path d="M22 54 L16 36 L36 46 Z" fill="#1e3a8a"/>
          <path d="M78 54 L84 36 L64 46 Z" fill="#1e3a8a"/>
          <path d="M25 52 L20 40 L34 48 Z" fill="#fda4af"/>
          <path d="M75 52 L80 40 L66 48 Z" fill="#fda4af"/>
          <!-- head -->
          <circle cx="50" cy="60" r="30" fill="#1e3a8a"/>
          <!-- face -->
          <ellipse cx="50" cy="62" rx="22" ry="20" fill="#162d6b"/>
          <!-- eyes white -->
          <circle cx="40" cy="58" r="9" fill="white"/>
          <circle cx="60" cy="58" r="9" fill="white"/>
          <!-- pupils -->
          <circle id="pL" cx="41" cy="58" r="5.5" fill="#040e1f"/>
          <circle id="pR" cx="61" cy="58" r="5.5" fill="#040e1f"/>
          <!-- highlights -->
          <circle cx="42" cy="56" r="2" fill="white"/>
          <circle cx="62" cy="56" r="2" fill="white"/>
          <!-- nose -->
          <polygon points="50,66 47,70 53,70" fill="#fda4af"/>
          <!-- mouth normal -->
          <g id="mouthG">
            <path d="M44 73 Q50 77 56 73" stroke="#e2e8f0" stroke-width="1.5" fill="none" stroke-linecap="round"/>
          </g>
          <!-- whiskers -->
          <line x1="18" y1="67" x2="43" y2="68" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
          <line x1="18" y1="72" x2="43" y2="71" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
          <line x1="57" y1="68" x2="82" y2="67" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
          <line x1="57" y1="71" x2="82" y2="72" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
          <!-- sparkles (happy) -->
          <g id="sparks" opacity="0">
            <text x="14" y="52" font-size="10" fill="#f59e0b">✦</text>
            <text x="76" y="52" font-size="10" fill="#f59e0b">✦</text>
          </g>
          <!-- tear (sad) -->
          <ellipse id="tear" cx="36" cy="68" rx="2" ry="3" fill="#60a5fa" opacity="0"/>
          <!-- body -->
          <ellipse cx="50" cy="94" rx="22" ry="14" fill="#1e3a8a"/>
          <ellipse cx="38" cy="96" rx="8" ry="5" fill="#162d6b"/>
          <ellipse cx="62" cy="96" rx="8" ry="5" fill="#162d6b"/>
        </svg>
      </div>
      <div class="mmsg">
        <div class="hi" id="mhi">Soruyu dikkatlice oku...</div>
        <div class="lo" id="mlo">En uygun şıkkı seç</div>
      </div>
    </div>

    <div class="cbody" id="cbody"></div>
    <div class="fbbar" id="fbbar"></div>
    <div class="nav">
      <button class="nb prev" id="bprev" onclick="prevQ()" disabled>◀ Önceki</button>
      <div class="dots" id="dots"></div>
      <button class="nb next" id="bnext" onclick="nextQ()" disabled>Sonraki ▶</button>
    </div>
  </div>

  <div class="results" id="results"></div>
</div>

<script>
const K=['A','B','C','D','E'];

/* ===== BÖLÜM 1 — 50 SORU ===== */
const q1=[
{s:1,q:"'Din' kavramının en kapsamlı tanımı aşağıdakilerden hangisidir?",opts:["Sadece ibadet kurallarından oluşan normlar bütünü","İnsanın Allah ile bireysel ilişkisini düzenleyen özel kurallar","İnsanı hem bireysel hem toplumsal hayatta yönlendiren, Allah'tan geldiğine inanılan ilkeler bütünü","Devlet yönetimine ilişkin siyasi kurallar toplamı","Yalnızca ahlaki öğütlerden oluşan felsefi bir sistem"],ans:2},
{s:2,q:"Dinin yorumu (te'vil/tefsir) kavramı ne anlama gelir?",opts:["Dini metinlerin değiştirilerek yeniden yazılması","Kutsal metinlerin ve dini hükümlerin anlaşılıp açıklanması süreci","Yalnızca âlimlerin okuyabileceği gizli bilgiler","Dini hükümlerin tamamen akılla belirlenmesi","Hz. Peygamber'in sözlerinin ezberden aktarılması"],ans:1},
{s:3,q:"Kozmolojik delilin dayandığı temel ilke aşağıdakilerden hangisidir?",opts:["Evrende mükemmel bir tasarım ve düzen vardır","İnsan zihninde en yüce varlık kavramı bulunur","Her sonucun bir nedeni, her nedenlinin de bir başlangıcı vardır","Dini deneyim evrensel bir gerçeği yansıtır","İnanç deneyimi bireyin psikolojisiyle açıklanamaz"],ans:2},
{s:4,q:"Teleolojik delilde 'tasarım' argümanı neyi kanıtlamaya çalışır?",opts:["Evrenin bir başlangıcının olduğunu","Allah'ın sonsuz ve zorunlu bir Varlık olduğunu","Evrende gözlemlenen düzen ve amacın bilinçli bir Yaratıcı'ya işaret ettiğini","İnsanın doğuştan Allah'a yönelik bir eğilimle doğduğunu","Dini deneyimlerin gerçek bir kaynaktan beslendiğini"],ans:2},
{s:5,q:"Ontolojik delilin diğer delillerden temel farkı nedir?",opts:["Evrendeki fiziksel olgulara dayanması","Dini metinlere atıfta bulunması","Gözlem ve deneye dayalı olması","Tamamen saf akıl yürütmeye dayanması, gözlem gerektirmemesi","Toplumsal deneyimleri temel alması"],ans:3},
{s:6,q:"Dinî tecrübe delilinin temelini oluşturan İslami kavram hangisidir?",opts:["Takva","Fıtrat","İcma","Kıyas","İçtihat"],ans:1},
{s:7,q:"'Kendisinden daha mükemmeli düşünülemeyen Varlık'ın gerçekte de var olması gerekir' argümanı hangi delile aittir?",opts:["Kozmolojik Delil","Teleolojik Delil","Ontolojik Delil","Dinî Tecrübe Delili","Ahlak Delili"],ans:2},
{s:8,q:"'Saatin varlığı saatçiyi kanıtlar' benzetmesi hangi delili açıklamak için kullanılır?",opts:["Kozmolojik Delil","Ontolojik Delil","Dinî Tecrübe Delili","Teleolojik Delil","Ahlak Delili"],ans:3},
{s:9,q:"Kozmolojik delile yöneltilen en yaygın eleştiri hangisidir?",opts:["Delil çok soyut ve anlaşılmazdır","'İlk Neden neden Allah olsun?' sorusuna kesin cevap verememesi","Evrim teorisiyle doğrudan çelişmesi","Öznel deneyimlere dayanması","Yalnızca Müslümanlara özgü olması"],ans:1},
{s:10,q:"Allah'ın varlığına dair delillerin genel özelliği aşağıdakilerden hangisidir?",opts:["Birbirini çürütür, tek doğru delil seçilmelidir","Yalnızca Müslüman düşünürlere aittir","Her biri farklı bir açıdan yaklaşır, birbirini destekler","Bilimsel deneyle kesin olarak ispatlanmıştır","Yalnızca felsefeciler tarafından kabul görür"],ans:2},
{s:11,q:"Dini tecrübe delilinin zayıf yönü olarak gösterilen husus nedir?",opts:["Evrendeki düzeni açıklayamaması","Soyut olması ve pratikte işe yaramaması","Öznel olması, bilimsel ölçüme kapalı bulunması","Evrim teorisiyle çelişmesi","Tarihsel kanıtlara dayanmaması"],ans:2},
{s:12,q:"'Din' kelimesinin Arapçada taşıdığı anlamlar arasında hangisi yer almaz?",opts:["Hüküm, yargı","İtaat, teslimiyet","Hesap, ceza","Kehanet, falcılık","Örf, gelenek"],ans:3},
{s:13,q:"İslam'a göre dinin temel amacı nedir?",opts:["Yalnızca ahiret kurtuluşunu güvence altına almak","Devlet otoritesini pekiştirmek","İnsanı dünya ve ahirette mutluluğa ulaştırmak","Aklı devre dışı bırakarak körü körüne itaati sağlamak","Sadece ahlaki erdemleri öğretmek"],ans:2},
{s:14,q:"Aşağıdakilerden hangisi ilahi (vahye dayalı) dinlerin ortak özelliği değildir?",opts:["Tevhid (Allah'ın birliği) inancı","Peygamberlik kurumu","Ahiret inancı","Çok tanrılı ibadet sistemi","Ahlaki sorumluluk"],ans:3},
{s:15,q:"Kelam ilminin temel işlevi nedir?",opts:["İslam hukukunun pratik hükümlerini belirlemek","İslam'ın inanç esaslarını akli yöntemlerle temellendirmek ve savunmak","Kur'an ayetlerini dil açısından incelemek","Hz. Peygamber'in hadislerini sınıflandırmak","Tasavvuf yolunu öğretmek"],ans:1},
{s:16,q:"Teleolojik delile yöneltilen en önemli itiraz hangisidir?",opts:["Zihinden gerçeğe geçişin mantıksal olmaması","Evrim teorisinin bu argümana alternatif açıklama sunması","Tarihsel kanıt bulunmaması","Deney ve gözleme dayanmaması","Ontolojik argümanla çelişmesi"],ans:1},
{s:17,q:"Kozmolojik delilde 'zorunlu varlık' kavramı neyi ifade eder?",opts:["Fizik yasalarına tabi olan ilk madde","Var olması için başka bir sebebe ihtiyaç duymayan, varlığı zorunlu olan Varlık","Evrenin kendi kendine var olabileceği fikri","İnsanın Allah'ı tanıma yeteneği","Doğadaki neden-sonuç zinciri"],ans:1},
{s:18,q:"Aşağıdaki bilim dallarından hangisi Allah'ın varlığına dair argümanlarla en doğrudan ilişkilidir?",opts:["Biyoloji","Kelam (İslam Teolojisi)","Fıkıh","Hadis","Siyer"],ans:1},
{s:19,q:"Hangi delil, yalnızca 'zihinsel kavramlar' üzerinden Allah'ın varlığını ispat etmeye çalışır?",opts:["Kozmolojik Delil","Teleolojik Delil","Dinî Tecrübe Delili","Ahlak Delili","Ontolojik Delil"],ans:4},
{s:20,q:"Fıtrat kavramı dinî tecrübe deliliyle nasıl ilişkilidir?",opts:["Fıtrat, insanın Allah'ı reddetme eğilimini ifade eder","Fıtrat, insanın doğuştan taşıdığı Allah'a yönelme eğilimini ifade eder; bu da dinî tecrübenin evrenselliğini açıklar","Fıtrat yalnızca ahlaki erdemleri kapsar","Fıtrat kavramı Kur'an'da geçmez","Fıtrat, sosyal öğrenmeyle kazanılan bir eğilimdir"],ans:1},
{s:21,q:"Allah'ın varlığına ilişkin deliller arasında en eski ve en yaygın kabul göreni hangisidir?",opts:["Ontolojik Delil","Dinî Tecrübe Delili","Kozmolojik Delil","Ahlak Delili","Epistemolojik Delil"],ans:2},
{s:22,q:"'Sonsuz geri gidiş imkânsızdır' önermesi hangi delilde kritik rol oynar?",opts:["Teleolojik Delil","Ontolojik Delil","Kozmolojik Delil","Dinî Tecrübe Delili","Tasarım Delili"],ans:2},

{s:26,tag:"Ayet Delil",ayet:'"Şüphesiz göklerin ve yerin yaratılmasında, gece ile gündüzün birbiri ardınca gelmesinde, insanlara yarar sağlayacak şeylerle denizde seyreden gemilerde, Allah\'ın gökten su indirip onunla yeri diriltmesinde… elbette düşünen bir topluluk için deliller vardır."',ayetRef:"Bakara, 2/164",q:"Bu ayet, Allah'ın varlığına dair hangi delil türüyle en doğrudan örtüşür?",opts:["Ontolojik Delil","Ahlak Delili","Kozmolojik / Teleolojik Delil","Dinî Tecrübe Delili","Tarihsel Delil"],ans:2},
{s:27,tag:"Ayet Delil",ayet:'"Biz onlara hem dış dünyada (âfâkta) hem de kendi içlerinde (enfüste) ayetlerimizi göstereceğiz."',ayetRef:"Fussilet, 41/53",q:"Bu ayette geçen 'âfâk' ve 'enfüs' kavramları sırasıyla neyi ifade eder?",opts:["Cennet ve cehennem","Geçmiş ve gelecek","Dış dünya/evren ve insanın iç dünyası","Melek ve şeytan","Dünya ve ahiret"],ans:2},
{s:28,tag:"Ayet Delil",ayet:'"Yoksa onlar hiçten mi yaratıldılar? Yoksa kendileri mi yaratıcı?"',ayetRef:"Tûr, 52/35",q:"Bu retorik soru, hangi delil türünü Kur'an diliyle ifade eder?",opts:["Teleolojik Delil","Kozmolojik Delil","Ontolojik Delil","Ahlak Delili","Dini Tecrübe Delili"],ans:1},
{s:29,tag:"Ayet Delil",ayet:'"Sen yüzünü hanif olarak dine, Allah\'ın insanları üzerinde yarattığı fıtrata yönelt."',ayetRef:"Rûm, 30/30",q:"Bu ayet, Allah'ın varlığına dair delillerden hangisiyle en doğrudan ilişkilidir?",opts:["Kozmolojik Delil","Teleolojik Delil","Ontolojik Delil","Ahlak Delili","Dinî Tecrübe Delili — fıtrat"],ans:4},

  2:{lbl:"Aşağıdaki metni okuyunuz. Sorular 29–31 bu metne aittir.",txt:"İslam hukukunun (fıkhın) sistematik hale gelmesi, büyük ölçüde hicrî 2–4. yüzyıllara (miladi 8–10. yüzyıl) denk gelen bir döneme aittir. Bu dönemde farklı bölgelerde yaşayan âlimler, Kur'an ve sünneti temel alarak hukuki soruları cevaplamaya çalışmışlardır. Irak ekolü akla daha fazla yer verirken Medine ekolü rivayete ve yerleşik uygulamaya ağırlık vermiştir. Zamanla dört büyük fıkıh mezhebi — Hanefilik, Malikilik, Şafiilik ve Hanbelilik — Ehlisünnet bünyesinde güçlenmiş ve günümüze kadar yaşamaya devam etmiştir. Bu mezheplerin her biri kendi usulünü (metodolojisini) geliştirmiş; ancak hepsi Kur'an, sünnet, icma ve kıyası temel kaynak olarak kabul etmektedir."}
};

/* ===== STATE ===== */
let sec=1,qi=0;
const ans={},score={1:0,2:0},done={1:false,2:false};
const msgs={
  normal:["Soruyu dikkatlice oku...","En uygun şıkkı seç"],
  happy:["Harika! 🎉","Çok iyi gidiyorsun!"],
  sad:["Üzülme, devam et!","Bir sonrakinde uygula 😊"],
  para:["Metni okuyup soruya geç 📜","Parçaya dayalı soru"]
};

function arr(){return sec===1?q1:q2;}

function switchSec(s){
  sec=s;qi=0;
  document.getElementById('tab1').classList.toggle('active',s===1);
  document.getElementById('tab2').classList.toggle('active',s===2);
  if(done[s]){document.getElementById('card').style.display='none';showResults();return;}
  document.getElementById('card').style.display='block';
  document.getElementById('results').classList.remove('show');
  const d=document.getElementById('divlabel');if(d)d.remove();
  renderQ();
}

function renderQ(){
  const a=arr(),item=a[qi],total=a.length;
  document.getElementById('pfill').style.width=(qi/total*100)+'%';
  document.getElementById('qlabel').textContent=`Soru ${item.s} / ${total}`;
  document.getElementById('spill').textContent=`✦ ${score[sec]} doğru`;

  const plbl=document.getElementById('plbl'),pbox=document.getElementById('pbox');
  if(item.paraId&&paras[item.paraId]){
    const prev=qi>0?a[qi-1]:null;
    const fresh=!prev||prev.paraId!==item.paraId;
    plbl.textContent='📄 '+(fresh?paras[item.paraId].lbl:'Önceki metin geçerliliğini korumaktadır');
    pbox.textContent=paras[item.paraId].txt;
    plbl.style.display='block';pbox.style.display='block';
    setCat('para');
  }else{
    plbl.style.display='none';pbox.style.display='none';
    setCat('normal');
  }

  if(item.divLabel){
    const ex=document.getElementById('divlabel');if(ex)ex.remove();
    const d=document.createElement('div');d.id='divlabel';
    d.style.cssText='background:#0f2040;border-left:3px solid #3b82f6;border-radius:0 6px 6px 0;padding:6px 14px;margin:12px 20px 4px;font-size:.69rem;font-weight:700;color:#60a5fa;text-transform:uppercase;letter-spacing:.4px';
    d.textContent=item.divLabel;
    document.getElementById('cbody').before(d);
  }

  let html='';
  if(item.tag) html+=`<span class="qtag">${item.tag}</span>`;
  if(item.ayet) html+=`<div class="ayet-box">${item.ayet}<span class="ref">${item.ayetRef}</span></div>`;
  html+=`<div class="qtext">${item.q}</div><div class="opts">`;
  item.opts.forEach((o,j)=>{
    html+=`<button class="opt" id="o${j}" onclick="choose(${j})"><span class="okey">${K[j]}</span><span>${o}</span></button>`;
  });
  html+='</div>';
  document.getElementById('cbody').innerHTML=html;

  const fb=document.getElementById('fbbar');fb.className='fbbar';fb.innerHTML='';
  document.getElementById('bprev').disabled=(qi===0);
  document.getElementById('bnext').disabled=true;
  document.getElementById('bnext').textContent=qi===a.length-1?'Sonuçları Gör ▶':'Sonraki ▶';
  renderDots();
  if(ans[item.s])restoreAns(item);
  const card=document.getElementById('card');
  card.style.animation='none';
  requestAnimationFrame(()=>{card.style.animation='cIn .28s ease';});
}

function restoreAns(item){
  const a=ans[item.s];
  document.querySelectorAll('.opt').forEach((b,i)=>{
    b.classList.add('locked');
    if(i===item.ans)b.classList.add('correct');
    if(i===a.chosen&&!a.ok)b.classList.add('wrong');
  });
  const fb=document.getElementById('fbbar');
  if(a.ok){fb.className='fbbar ok';fb.innerHTML='✓ Doğru!';setCat('happy');}
  else{fb.className='fbbar bad';fb.innerHTML=`✗ Yanlış. Doğru cevap: <strong>${K[item.ans]}</strong>`;setCat('sad');}
  document.getElementById('bnext').disabled=false;
}

function choose(j){
  const a=arr(),item=a[qi];
  if(ans[item.s])return;
  const ok=(j===item.ans);
  ans[item.s]={chosen:j,ok};
  if(ok)score[sec]++;
  document.getElementById('spill').textContent=`✦ ${score[sec]} doğru`;
  document.querySelectorAll('.opt').forEach((b,i)=>{
    b.classList.add('locked');
    if(i===item.ans)b.classList.add('correct');
    if(i===j&&!ok)b.classList.add('wrong');
  });
  const fb=document.getElementById('fbbar');
  const cb=document.getElementById('catbox');
  cb.classList.remove('bounce','shake');
  if(ok){
    fb.className='fbbar ok';fb.innerHTML='✓ Doğru! 🎉';
    setCat('happy');void cb.offsetWidth;cb.classList.add('bounce');
    setTimeout(()=>cb.classList.remove('bounce'),600);
  }else{
    fb.className='fbbar bad';fb.innerHTML=`✗ Yanlış. Doğru cevap: <strong>${K[item.ans]}</strong>`;
    setCat('sad');void cb.offsetWidth;cb.classList.add('shake');
    setTimeout(()=>cb.classList.remove('shake'),550);
  }
  renderDots();
  document.getElementById('bnext').disabled=false;
}

function prevQ(){if(qi>0){qi--;renderQ();}}
function nextQ(){
  const a=arr();
  if(qi<a.length-1){qi++;renderQ();}
  else{done[sec]=true;showResults();}
}

function renderDots(){
  const a=arr();
  document.getElementById('dots').innerHTML=a.map((item,i)=>{
    let c='dot';
    if(i===qi)c+=' cur';
    else if(ans[item.s])c+=ans[item.s].ok?' ok':' bad';
    else if(i<qi)c+=' seen';
    return`<div class="${c}"></div>`;
  }).join('');
}

function setCat(state){
  const pL=document.getElementById('pL'),pR=document.getElementById('pR');
  const mg=document.getElementById('mouthG'),sp=document.getElementById('sparks'),tr=document.getElementById('tear');
  const[hi,lo]=msgs[state]||msgs.normal;
  document.getElementById('mhi').textContent=hi;
  document.getElementById('mlo').textContent=lo;
  sp.setAttribute('opacity','0');tr.setAttribute('opacity','0');
  if(state==='happy'){
    pL.setAttribute('cy','55');pR.setAttribute('cy','55');
    pL.setAttribute('cx','41');pR.setAttribute('cx','61');
    mg.innerHTML=`<path d="M43 73 Q50 80 57 73" stroke="#10b981" stroke-width="2" fill="none" stroke-linecap="round"/>`;
    sp.setAttribute('opacity','1');
  }else if(state==='sad'){
    pL.setAttribute('cy','60');pR.setAttribute('cy','60');
    pL.setAttribute('cx','42');pR.setAttribute('cx','60');
    mg.innerHTML=`<path d="M43 76 Q50 71 57 76" stroke="#94a3b8" stroke-width="1.5" fill="none" stroke-linecap="round"/>`;
    tr.setAttribute('opacity','0.8');
  }else{
    pL.setAttribute('cy','58');pR.setAttribute('cy','58');
    pL.setAttribute('cx','41');pR.setAttribute('cx','61');
    mg.innerHTML=`<path d="M44 73 Q50 77 56 73" stroke="#e2e8f0" stroke-width="1.5" fill="none" stroke-linecap="round"/>`;
  }
}

function showResults(){
  document.getElementById('card').style.display='none';
  const a=arr(),total=a.length,cor=score[sec];
  const pct=Math.round(cor/total*100);
  let icon,title,sub;
  if(pct>=85){icon='🏆';title='Mükemmel!';sub='Harika bir performans sergiledin!';}
  else if(pct>=65){icon='🎓';title='Tebrikler!';sub='Konuya hâkimiyetin oldukça iyi!';}
  else if(pct>=45){icon='📚';title='İyi Başlangıç!';sub='Biraz daha çalışmaya devam et!';}
  else{icon='💪';title='Devam Et!';sub='Tekrar çalışarak başarabilirsin!';}
  const deg=Math.round(cor/total*360);
  const other=sec===1?2:1;
  const res=document.getElementById('results');
  res.innerHTML=`
    <span class="res-icon">${icon}</span>
    <div class="res-title">${title}</div>
    <div class="res-by">Hazırlayan: Ayşe Yazıcı</div>
    <div class="res-sub">${sub}</div>
    <div class="sring" style="background:conic-gradient(var(--gold) ${deg}deg,var(--blue-pale) ${deg}deg)">
      <div class="sinner">
        <div class="sbig" id="scnum">0</div>
        <div class="sden">/ ${total} doğru</div>
      </div>
    </div>
    <div class="stat-row">
      <div class="stat g"><div class="v">${cor}</div><div class="l">Doğru ✓</div></div>
      <div class="stat r"><div class="v">${total-cor}</div><div class="l">Yanlış ✗</div></div>
      <div class="stat b"><div class="v">%${pct}</div><div class="l">Başarı</div></div>
    </div>
    <button class="rbtn" onclick="restartSec()">↩ Tekrar Çöz</button>
    <button class="rbtn gold" onclick="switchSec(${other})">${other===2?'2. Bölüm ▶':'◀ 1. Bölüm'}</button>
  `;
  res.classList.add('show');
  let n=0;const step=Math.max(1,Math.ceil(cor/25));
  const iv=setInterval(()=>{n=Math.min(n+step,cor);document.getElementById('scnum').textContent=n;if(n>=cor)clearInterval(iv);},55);
  if(pct>=55)confetti();
}

function restartSec(){
  score[sec]=0;done[sec]=false;
  arr().forEach(item=>delete ans[item.s]);
  qi=0;
  document.getElementById('card').style.display='block';
  document.getElementById('results').classList.remove('show');
  const d=document.getElementById('divlabel');if(d)d.remove();
  renderQ();
}

function confetti(){
  const cl=['#1e3a8a','#f59e0b','#3b82f6','#1a2f5e','#ffffff','#60a5fa','#fcd34d'];
  const c=document.getElementById('cfc');c.innerHTML='';
  for(let i=0;i<90;i++){
    const p=document.createElement('div');p.className='cp';
    p.style.cssText=`left:${Math.random()*100}%;top:${-5-Math.random()*25}px;background:${cl[i%cl.length]};animation-delay:${Math.random()*1.3}s;animation-duration:${2.2+Math.random()*1.6}s;width:${6+Math.random()*6}px;height:${10+Math.random()*8}px;transform:rotate(${Math.random()*360}deg)`;
    c.appendChild(p);
  }
  setTimeout(()=>c.innerHTML='',5000);
}

switchSec(1);
</script>
</body>
</html>
